<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitApp Pro - Ultimate & Fully Connected</title>
    
    <!-- Meta tag fondamentali per trasformare la pagina in una PWA a schermo intero -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22FitApp%20Pro%22%2C%22short_name%22%3A%22FitApp%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23121212%22%2C%22theme_color%22%3A%22%23121212%22%2C%22icons%22%3A%5B%5D%7D">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 12px; padding-bottom: 90px; max-width: 600px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; background: var(--card-bg); padding: 12px 16px; border-radius: 14px; }
        .date-box { font-size: 14px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        .top-icons { display: flex; gap: 10px; align-items: center; }
        .icon-btn { background: #2d2d2d; border: none; color: white; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; }
        
        /* Health Connect Banner */
        .health-banner { background: linear-gradient(135deg, #2a1b3d, #1a1a2e); border: 1px solid var(--accent-purple); border-radius: 14px; padding: 14px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .health-info h4 { font-size: 14px; color: #d8b4fe; margin-bottom: 2px; }
        .health-info p { font-size: 12px; color: var(--text-muted); }
        .connect-btn { background: var(--accent-purple); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }

        /* Metriche in evidenza */
        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
        .metric-card { background: var(--card-bg); padding: 10px 6px; border-radius: 12px; text-align: center; }
        .metric-card span { font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px; }
        .metric-card strong { font-size: 14px; color: white; }

        /* Calorie Card */
        .calorie-card { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .calorie-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
        .calorie-main { font-size: 28px; font-weight: 700; }
        .calorie-sub { font-size: 13px; color: var(--text-muted); }

        /* Macro progress */
        .macros-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
        .macro-card { background: var(--card-bg); padding: 12px; border-radius: 12px; text-align: center; }
        .macro-card span { font-size: 12px; color: var(--text-muted); }
        .macro-card p { font-size: 13px; font-weight: 600; margin-top: 4px; }

        /* Bottom Nav */
        nav { position: fixed; bottom: 0; left: 0; right: 0; background: #18181b; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #27272a; max-width: 600px; margin: 0 auto; z-index: 1000; }
        .nav-item { background: none; border: none; color: var(--text-muted); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .nav-item span:first-child { font-size: 18px; }
        .nav-item.active { color: var(--accent-green); }
    </style>
</head>
<body>

    <header>
        <div class="date-box">
            <span>📅</span> <span id="current-date">Venerdì 23 Ottobre</span>
        </div>
        <div class="top-icons">
            <button class="icon-btn" onclick="toggleAppMode()" title="Schermo Intero">📱</button>
            <button class="icon-btn" onclick="triggerHeartSync()" title="Google Health">💚</button>
            <button class="icon-btn" onclick="openProfile()">👤</button>
            <button class="icon-btn" onclick="openL5S1()">🎯</button>
        </div>
    </header>

    <div class="health-banner">
        <div class="health-info">
            <h4>Google Health Connect</h4>
            <p id="sync-status">Peso 62.6kg - 6420 passi - 791 kcal</p>
        </div>
        <button class="connect-btn" id="connect-health-btn" onclick="requestHealthAccess()">Connetti</button>
    </div>

    <div class="metrics-grid">
        <div class="metric-card">
            <span>Passi ✏️</span>
            <strong id="val-steps">6420</strong>
        </div>
        <div class="metric-card">
            <span>Kcal Attive</span>
            <strong id="val-kcal">791</strong>
        </div>
        <div class="metric-card">
            <span>Sonno</span>
            <strong>7.5h</strong>
        </div>
        <div class="metric-card">
            <span>Acqua</span>
            <strong>1.8L</strong>
        </div>
    </div>

    <div class="calorie-card">
        <div class="calorie-header">
            <div>
                <span class="calorie-sub">Calorie Assunte</span>
                <div class="calorie-main"><span id="eaten-kcal">0</span> / <span id="target-kcal">1280</span> kcal</div>
            </div>
        </div>
        <div style="font-size: 12px; color: var(--text-muted);">1280 kcal rimaste</div>
    </div>

    <div class="macros-grid">
        <div class="macro-card">
            <span>Proteine</span>
            <p><span id="prot-curr">0</span> / 113 g</p>
        </div>
        <div class="macro-card">
            <span>Carboidrati</span>
            <p><span id="carb-curr">0</span> / 127 g</p>
        </div>
        <div class="macro-card">
            <span>Grassi</span>
            <p><span id="fat-curr">0</span> / 36 g</p>
        </div>
    </div>

    <nav>
        <button class="nav-item active"><span>📊</span><span>Trend</span></button>
        <button class="nav-item"><span>📖</span><span>Ricettario</span></button>
        <button class="nav-item"><span>🔔</span><span>Notifiche</span></button>
        <button class="nav-item"><span>🎨</span><span>Tema</span></button>
        <button class="nav-item"><span>☁️</span><span>Cloud</span></button>
    </nav>

    <script>
        function toggleAppMode() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert("Modalità schermo intero attivata.");
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function requestHealthAccess() {
            const btn = document.getElementById('connect-health-btn');
            const status = document.getElementById('sync-status');
            btn.innerText = "Autorizzazione...";
            setTimeout(() => {
                if(confirm("Vuoi consentire a FitApp Pro di leggere i dati da Google Health Connect (Passi, Sonno, Attività)?")) {
                    btn.innerText = "Connesso ✓";
                    btn.style.background = "#10b981";
                    status.innerText = "Sincronizzato in tempo reale (Google Health)";
                } else {
                    btn.innerText = "Annullato";
                    btn.style.background = "#ef4444";
                }
            }, 500);
        }

        function triggerHealthSync() {
            requestHealthAccess();
        }

        function openProfile() { alert("Profilo utente attivo."); }
        function openL5S1() { alert("Sezione esercizi L5-S1 attiva."); }
    </script>
</body>
</html>
